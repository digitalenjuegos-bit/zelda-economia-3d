<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>El Reino de la Economía</title>
  <script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2e9d8;
      --parchment: #f7efdd;
      --parchment-deep: #e8dcbe;
      --text: #2d2a22;
      --muted: #6b6350;
      --heart: #e74c3c;
      --rupee: #27ae60;
      --rune: #17b8a6;
      --gold: #caa638;
      --gold-deep: #8a6d1c;
      --border: #5a4a2a;
      --danger: #b03a2e;
      --ok: #1e8449;
      --transition: .4s;
      --font-title: 'Cinzel', Georgia, serif;
      --font-body: 'Nunito', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-body);
      background: #0e1a12;
      color: var(--text);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Escenario 3D ─────────────────────────────────────────── */
    #game { position: fixed; inset: 0; width: 100%; height: 100%; background: #74b9ff; }
    #threeCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ── HUD (lo construye src/ui/hud.js) ──────────────────────── */
    .hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    .heartsRow { position: absolute; left: 18px; top: 14px; display: flex; gap: 6px; }
    .heart {
      width: 26px; height: 26px; position: relative;
      background: var(--heart);
      clip-path: polygon(50% 0%, 100% 34%, 82% 100%, 50% 82%, 18% 100%, 0% 34%);
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.35));
      transition: opacity .25s;
    }
    .heart.half { opacity: .5; }
    .heart.empty { opacity: .18; }
    .studentName {
      position: absolute; left: 20px; top: 46px;
      font-size: .78rem; font-weight: 700; color: #fff8e0;
      text-shadow: 0 1px 3px rgba(0,0,0,.7); letter-spacing: .02em;
    }
    .streak {
      position: absolute; left: 20px; top: 66px;
      font-family: var(--font-title); font-size: .8rem; font-weight: 700;
      color: #ffd76a; text-shadow: 0 1px 3px rgba(0,0,0,.7);
      display: none;
    }
    .streak.visible { display: block; }
    .rupeeCounter {
      position: absolute; right: 18px; top: 12px;
      display: flex; align-items: center; gap: 7px;
      font-size: 1.25rem; font-weight: 800; color: #eafff0;
      text-shadow: 0 2px 4px rgba(0,0,0,.6);
    }
    .rupeeCounter.bump { animation: rupeeBump .45s ease; }
    @keyframes rupeeBump { 40% { transform: scale(1.22); } }
    .rupeeIcon {
      width: 17px; height: 24px; background: var(--rupee);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }
    .regionTitle {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      font-family: var(--font-title); font-size: 1.05rem; font-weight: 700;
      color: #fff6d8; text-shadow: 0 2px 5px rgba(0,0,0,.75);
      white-space: nowrap; letter-spacing: .06em;
    }
    .runesRow { position: absolute; left: 18px; bottom: 18px; display: flex; gap: 8px; }
    .rune {
      width: 22px; height: 22px; background: #123c3f;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      opacity: .45; transition: all .5s;
    }
    .rune.lit { background: #37f2dc; opacity: 1; filter: drop-shadow(0 0 7px rgba(55,242,220,.9)); }
    .minimap {
      position: absolute; right: 18px; bottom: 18px;
      width: 132px; height: 132px; border-radius: 50%;
      border: 3px solid rgba(90,74,42,.9);
      box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 0 18px rgba(0,0,0,.35);
      overflow: hidden; background: #22331f;
    }
    .minimap canvas { width: 100%; height: 100%; display: block; }
    .soundBtn {
      position: absolute; right: 18px; top: 52px;
      pointer-events: auto; cursor: pointer;
      font-family: var(--font-body); font-size: .78rem; font-weight: 700;
      color: #fff6d8; background: rgba(20,32,24,.55);
      border: 1px solid rgba(255,246,214,.45); border-radius: 8px;
      padding: 5px 10px;
    }
    .soundBtn.muted { color: #caa6a0; border-color: rgba(255,180,160,.4); }
    .hintMsg {
      position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%);
      font-size: .95rem; font-weight: 700; color: #fff6d8;
      background: rgba(20,32,24,.62); border: 1px solid rgba(255,246,214,.4);
      border-radius: 10px; padding: 8px 16px; white-space: nowrap;
      opacity: 0; transition: opacity .3s; pointer-events: none;
    }
    .hintMsg.visible { opacity: 1; }
    .hudToast {
      position: absolute; left: 50%; top: 88px; transform: translateX(-50%);
      font-size: .95rem; font-weight: 700; color: var(--text);
      background: var(--parchment); border: 2px solid var(--border);
      border-radius: 10px; padding: 9px 18px; max-width: 86%;
      box-shadow: 0 6px 18px rgba(0,0,0,.45);
      opacity: 0; transition: opacity .35s; pointer-events: none;
    }
    .hudToast.visible { opacity: 1; }
    .hudToast.success { border-color: var(--ok); color: #14532d; }
    .hudToast.danger { border-color: var(--danger); color: #7a171c; }

    /* ── Panel de pregunta (pergamino) ─────────────────────────── */
    .quiz-panel {
      position: absolute; inset: 0; z-index: 50;
      display: none; align-items: center; justify-content: center;
      background: rgba(12,20,14,.55); backdrop-filter: blur(3px);
      pointer-events: auto; padding: 16px;
    }
    .quiz-panel.open { display: flex; }
    .quiz-card {
      background: var(--parchment);
      border: 3px solid var(--border); border-radius: 6px;
      box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 0 60px rgba(138,109,28,.18);
      max-width: 640px; width: 100%; padding: 26px 30px;
      position: relative;
    }
    .quiz-card::before {
      content: ''; position: absolute; inset: 7px;
      border: 1px solid rgba(90,74,42,.45); border-radius: 4px; pointer-events: none;
    }
    .quiz-meta {
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      font-size: .8rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px;
    }
    .quiz-q {
      font-family: var(--font-title); font-size: 1.12rem; font-weight: 600;
      line-height: 1.5; margin-bottom: 18px; color: #241f14;
    }
    .quiz-opts { display: flex; flex-direction: column; gap: 9px; }
    .quiz-opt {
      display: flex; gap: 12px; align-items: flex-start; text-align: left;
      font-family: var(--font-body); font-size: .95rem; line-height: 1.4;
      background: rgba(255,252,240,.65); color: var(--text);
      border: 2px solid rgba(90,74,42,.4); border-radius: 8px;
      padding: 11px 13px; cursor: pointer; transition: all .18s;
    }
    .quiz-opt:hover:not(:disabled) { border-color: var(--gold-deep); background: #fffdf2; transform: translateX(3px); }
    .quiz-opt:disabled { cursor: default; opacity: .85; }
    .quiz-opt .letter {
      flex: 0 0 auto; width: 26px; height: 26px; margin-top: 1px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-title); font-weight: 700; font-size: .85rem;
      background: var(--gold); color: #3a2a00; border-radius: 50%;
      box-shadow: inset 0 0 0 1.5px rgba(58,42,0,.35);
    }
    .quiz-opt.correct { border-color: var(--ok); background: #e4f6e4; opacity: 1; }
    .quiz-opt.correct .letter { background: var(--ok); color: #fff; }
    .quiz-opt.wrong { border-color: var(--danger); background: #f9e3e0; }
    .quiz-opt.wrong .letter { background: var(--danger); color: #fff; }
    .quiz-timerbar { height: 5px; background: rgba(90,74,42,.2); border-radius: 3px; margin-top: 16px; overflow: hidden; }
    .quiz-timerbar > div { height: 100%; background: linear-gradient(90deg, var(--ok), var(--gold), var(--danger)); width: 100%; }
    .quiz-feedback {
      display: none; margin-top: 14px; padding: 12px 14px;
      border-radius: 8px; font-size: .92rem; line-height: 1.45;
    }
    .quiz-feedback.ok { display: block; background: #e4f6e4; border-left: 5px solid var(--ok); color: #14532d; }
    .quiz-feedback.bad { display: block; background: #f9efdd; border-left: 5px solid var(--gold-deep); color: #4a3a14; }
    .quiz-actions { margin-top: 16px; display: none; justify-content: center; }

    /* ── Pantallas (intro, reglas, etc.) ───────────────────────── */
    .screens { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
    .screen {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, rgba(30,52,36,.92), rgba(8,14,10,.97));
      pointer-events: auto; padding: 18px; overflow-y: auto;
    }
    .screen.open { display: flex; }
    .card {
      background: var(--parchment);
      border: 3px solid var(--border); border-radius: 8px;
      box-shadow: 0 22px 60px rgba(0,0,0,.65), inset 0 0 70px rgba(138,109,28,.16);
      padding: 30px 34px; max-width: 620px; width: 100%;
      position: relative; text-align: center;
    }
    .card::before {
      content: ''; position: absolute; inset: 8px;
      border: 1px solid rgba(90,74,42,.4); border-radius: 5px; pointer-events: none;
    }
    .card h1 {
      font-family: var(--font-title); font-size: 1.9rem; font-weight: 700;
      color: #241f14; margin-bottom: 8px; letter-spacing: .03em;
    }
    .card h2 { font-family: var(--font-title); font-size: 1.35rem; color: #241f14; margin-bottom: 12px; }
    .card .sub { font-size: 1rem; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .card label { font-weight: 700; font-size: .95rem; display: block; margin-bottom: 6px; color: #3a3222; }
    .card select {
      width: 100%; max-width: 420px; font-family: var(--font-body);
      font-size: 1rem; font-weight: 600; padding: 10px 12px;
      border: 2px solid var(--border); border-radius: 8px;
      background: #fffdf2; color: var(--text); cursor: pointer;
    }
    .status { min-height: 22px; font-size: .88rem; font-weight: 700; margin-top: 10px; }
    .status.wait { color: #8a6d1c; }
    .status.ok { color: var(--ok); }
    .status.blocked { color: var(--danger); }
    .rules-list { text-align: left; margin: 14px 0; padding-left: 22px; line-height: 1.65; font-size: .95rem; }
    .rules-list li { margin-bottom: 7px; }
    .rules-check {
      display: flex; gap: 10px; align-items: center; text-align: left;
      background: #fdf6dd; border: 2px solid var(--gold-deep); border-radius: 10px;
      padding: 12px 14px; margin: 14px 0; cursor: pointer; font-weight: 700; font-size: .93rem;
    }
    .rules-check input { width: 20px; height: 20px; accent-color: var(--ok); cursor: pointer; }
    .btn {
      display: inline-block; border: 2px solid #3a2f14; cursor: pointer;
      font-family: var(--font-title); font-weight: 700; font-size: .98rem;
      padding: 12px 26px; border-radius: 8px; letter-spacing: .04em;
      background: linear-gradient(180deg, #e8c96a, #caa638);
      color: #2a2004; box-shadow: 0 4px 0 #8a6d1c, 0 8px 16px rgba(0,0,0,.35);
      transition: transform .12s, box-shadow .12s;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #8a6d1c; }
    .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: 0 4px 0 #8a6d1c; }
    .btn.secondary { background: linear-gradient(180deg, #d8d2c0, #b8b09a); box-shadow: 0 4px 0 #6b6350; color: #2d2a22; }
    .btn.danger { background: linear-gradient(180deg, #e08a7a, #b03a2e); color: #fff; box-shadow: 0 4px 0 #6b1f16; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    .big-grade {
      font-family: var(--font-title); font-size: 4rem; font-weight: 700; color: var(--ok);
      text-shadow: 0 3px 0 rgba(0,0,0,.15); margin: 6px 0;
    }
    .rank-chip {
      display: inline-block; font-family: var(--font-title); font-weight: 700;
      background: var(--gold); color: #3a2a00; border-radius: 50%;
      width: 54px; height: 54px; line-height: 54px; font-size: 1.6rem;
      box-shadow: inset 0 0 0 3px rgba(58,42,0,.3); margin-bottom: 8px;
    }
    .stat-row { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; margin: 12px 0; }
    .stat { min-width: 90px; }
    .stat .v { font-family: var(--font-title); font-size: 1.3rem; font-weight: 700; color: #241f14; }
    .stat .k { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .resume-card {
      margin-top: 14px; padding: 12px; border-radius: 10px;
      background: #e4f0e4; border: 2px dashed var(--ok); font-size: .9rem; font-weight: 700;
    }
    .link-btn {
      background: none; border: none; color: #8a6d1c; font-weight: 700;
      font-size: .85rem; cursor: pointer; text-decoration: underline; margin-top: 14px; pointer-events: auto;
    }

    /* ── Ranking ──────────────────────────────────────────────── */
    .rank-modal {
      position: absolute; inset: 0; display: none; z-index: 70;
      align-items: center; justify-content: center;
      background: rgba(8,14,10,.8); pointer-events: auto; padding: 16px;
    }
    .rank-modal.open { display: flex; }
    .rank-list { text-align: left; max-height: 46vh; overflow-y: auto; margin: 10px 0; width: 100%; }
    .rank-item {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 9px 12px; border-bottom: 1px solid rgba(90,74,42,.25); font-size: .95rem;
    }
    .rank-item .pts { font-weight: 800; color: var(--rupee); }
    .rank-updated { font-size: .78rem; color: var(--muted); }

    /* ── Fundido y carga ───────────────────────────────────────── */
    .fadeLayer {
      position: absolute; inset: 0; background: #000; opacity: 0;
      pointer-events: none; transition: opacity .4s ease; z-index: 65;
    }
    .fadeLayer.on { opacity: 1; pointer-events: auto; }
    .loadingLayer {
      position: absolute; inset: 0; display: none; z-index: 75;
      align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      background: rgba(8,14,10,.88); pointer-events: auto; color: #fff6d8;
    }
    .loadingLayer.open { display: flex; }
    .loadingLayer .t { font-family: var(--font-title); font-size: 1.15rem; letter-spacing: .06em; }
    .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid rgba(255,246,214,.25); border-top-color: var(--gold);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Panel docente (src/ui/teacher.js, no modificar IDs) ───── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(8,16,10,.78); z-index: 90;
      align-items: flex-start; justify-content: center; padding: 26px 14px; overflow-y: auto;
    }
    .modal-overlay[hidden] { display: none; }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--parchment); border: 3px solid var(--gold-deep); border-radius: 10px;
      max-width: 760px; width: 100%; padding: 22px; box-shadow: 0 12px 34px rgba(0,0,0,.6);
    }
    .modal h2 { font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 10px; color: #241f14; }
    .modal-close {
      float: right; background: none; border: none; font-size: 1.5rem; cursor: pointer;
      color: #6b6350; padding: 2px 9px; border-radius: 8px;
    }
    .modal-close:hover { background: rgba(0,0,0,.08); }
    .teacher-login { text-align: center; padding: 18px 0; }
    .teacher-login input {
      padding: 12px 14px; font-size: 1rem; border: 2 solid #b8b09a;
      border: 2px solid #b8b09a; border-radius: 10px; width: 260px; max-width: 100%;
      font-family: inherit; background: #fffdf2;
    }
    .teacher-panel table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .88rem; }
    .teacher-panel th, .teacher-panel td { border: 1px solid #c9bfa4; padding: 8px 9px; text-align: left; }
    .teacher-panel th { background: #3a3222; color: #f2e9d8; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
    .teacher-panel tr:nth-child(even) td { background: rgba(0,0,0,.04); }
    .teacher-controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; align-items: center; }
    .teacher-controls select {
      padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px;
      background: #fffdf2; font-family: inherit; font-weight: 600;
    }
    .table-wrap { overflow-x: auto; }
    .t-msg { padding: 10px; color: #6b6350; font-size: .92rem; }
    .t-msg.err { color: var(--danger); font-weight: 700; }
    .avg-chip {
      display: inline-flex; gap: 8px; align-items: baseline; margin: 4px 6px 4px 0;
      background: #f0e8d2; border: 1px solid #c9bfa4; border-radius: 20px; padding: 5px 12px; font-size: .85rem;
    }
    .avg-chip.all { background: #fdf6dd; }
    .avg-c { font-weight: 800; color: #3a3222; }
    .avg-v { font-family: var(--font-title); font-weight: 700; color: var(--ok); }
    .avg-n { color: var(--muted); font-size: .78rem; }
    .grade-pill { padding: 2px 9px; border-radius: 12px; color: #fff; font-weight: 700; }
    .grade-pill.g-ok { background: var(--ok); }
    .grade-pill.g-mid { background: #b9770e; }
    .grade-pill.g-low { background: var(--danger); }
    .mk-btn {
      border: none; cursor: pointer; font-family: inherit; font-weight: 800;
      font-size: .74rem; letter-spacing: .04em; padding: 6px 10px; border-radius: 6px;
    }
    .mk-red { background: var(--danger); color: #fff; }
    .mk-red.armed { background: #7a171c; }
    .mk-xs { font-size: .7rem; padding: 4px 8px; }
    .nowrap { white-space: nowrap; }
    .error {
      display: none; margin-top: 12px; padding: 12px 14px; background: #f9e3e0;
      border-left: 5px solid var(--danger); border-radius: 8px; color: #7a171c; font-size: .95rem;
    }
    .error.show { display: block; }
    .teacher-trigger {
      position: fixed; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4);
      cursor: pointer; z-index: 80; opacity: .45; color: #fff; font-size: .7rem; line-height: 1;
    }
    .teacher-trigger:hover { opacity: 1; background: rgba(255,255,255,.34); }

    @media (max-width: 600px) {
      .heartsRow { left: 10px; top: 10px; }
      .heart { width: 20px; height: 20px; }
      .studentName { top: 36px; font-size: .68rem; }
      .streak { top: 52px; font-size: .7rem; }
      .rupeeCounter { right: 10px; font-size: 1rem; }
      .regionTitle { font-size: .82rem; }
      .runesRow { bottom: 12px; left: 12px; }
      .rune { width: 18px; height: 18px; }
      .minimap { width: 96px; height: 96px; right: 12px; bottom: 12px; }
      .soundBtn { top: 40px; right: 10px; font-size: .68rem; padding: 4px 8px; }
      .card { padding: 20px 18px; }
      .card h1 { font-size: 1.4rem; }
      .big-grade { font-size: 3rem; }
      .quiz-card { padding: 18px 16px; }
      .quiz-q { font-size: 1rem; }
      .hintMsg { font-size: .8rem; bottom: 128px; }
    }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="threeCanvas"></canvas>
  </div>

  <!-- Acceso discreto del docente (src/ui/teacher.js) -->
  <button class="teacher-trigger" id="teacherTrigger" title="Acceso del docente" aria-label="Acceso del docente">&#9679;</button>

  <!-- Modal del panel docente: los IDs los usa src/ui/teacher.js (no tocar) -->
  <div class="modal-overlay" id="modal-teacher" hidden>
    <div class="modal">
      <button class="modal-close" id="btnCloseTeacher" aria-label="Cerrar">&times;</button>
      <h2>Panel docente</h2>
      <div id="teacherLogin" class="teacher-login">
        <label for="teacherKeyInput">Clave del docente</label>
        <input type="password" id="teacherKeyInput" placeholder="Clave" autocomplete="off">
        <div style="margin-top:14px;">
          <button class="btn" id="btnValidateKey">Ingresar</button>
        </div>
        <div id="teacherKeyError" class="error"></div>
      </div>
      <div id="teacherPanel" class="teacher-panel" hidden>
        <div class="teacher-controls">
          <button class="btn" id="btnExport">Exportar a Excel</button>
          <button class="btn danger" id="btnClearAll">Borrar todas las notas</button>
          <button class="btn secondary" id="btnReloadTeacher">Recargar</button>
          <select id="teacherFilter" aria-label="Filtrar por curso"></select>
          <span id="teacherCount" style="align-self:center;color:#6b6350;font-size:.9rem;"></span>
        </div>
        <div id="teacherAverages"></div>
